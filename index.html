<!-- 濾鏡選擇器 -->
<div class="picker-group">
  <label>✨ 選擇照片濾鏡風格：</label>
  <select id="filter-select" class="filter-select">
    <option value="none">原圖風格 (Original)</option>
    <option value="vintage">韓系柔焦 (Soft Vintage)</option>
    <option value="bw">黑白冷調 (Monochrome)</option>
    <option value="vivid">鮮豔奶油 (Vivid Pop)</option>
  </select>
</div>

<!-- 下載按鈕組 -->
<button id="download-btn" class="btn success" disabled>下載照片作品 💾</button>
<button id="download-video-btn" class="btn video-btn" disabled>下載拍攝動態影片 🎥</button>

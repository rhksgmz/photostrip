<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXhOrizon in Kaohsiung</title>
  <!-- 載入專屬科技金屬感字體 Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 修改標題為指定文字 -->
    <h1 class="exo-title">EXhOrizon in Kaohsiung</h1>
    
    <!-- 左側：相機與控制區 -->
    <div class="controls-panel">
      <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="countdown-overlay"></div>
      </div>

      <div class="buttons">
        <button id="start-btn" class="btn primary">開始連拍 (4張)</button>
        <button id="retake-btn" class="btn secondary" disabled>重新拍照</button>
      </div>

      <!-- 特效濾鏡選擇 -->
      <div class="picker-group">
        <label>✨ 選擇特效濾鏡：</label>
        <div class="options-row">
          <button class="filter-btn active" data-filter="normal">原圖</button>
          <button class="filter-btn" data-filter="beauty">美肌</button>
          <button class="filter-btn" data-filter="retro">復古</button>
          <button class="filter-btn" data-filter="vintage">膠片</button>
          <button class="filter-btn" data-filter="bw">黑白</button>
        </div>
      </div>

      <!-- 相框選擇 -->
      <div class="picker-group">
        <label>🖼️ 選擇專屬相框：</label>
        <div class="options-row">
          <div class="frame-option active" data-frame="warm">
            <img src="frame_warm.png" alt="暖色手繪框">
          </div>
          <div class="frame-option" data-frame="cool">
            <img src="frame_cool.png" alt="銀河藍色框">
          </div>
        </div>
      </div>

      <button id="download-btn" class="btn success" disabled>下載 / 長按儲存作品 💾</button>
    </div>

    <!-- 右側：四格照片預覽區 -->
    <div class="preview-panel">
      <div id="photo-strip">
        <!-- 下層：4 張照片 -->
        <div class="photo-layer">
          <div class="photo-frame"><canvas id="canvas1"></canvas></div>
          <div class="photo-frame"><canvas id="canvas2"></canvas></div>
          <div class="photo-frame"><canvas id="canvas3"></canvas></div>
          <div class="photo-frame"><canvas id="canvas4"></canvas></div>
        </div>

        <!-- 上層：PNG 相框遮罩 -->
        <img id="frame-overlay" src="frame_warm.png" alt="相框">

        <!-- 拍照完成後會自動產生這張透明 img，讓手機可以直接長按儲存 -->
        <img id="final-result-img" alt="長按儲存拍貼" style="display: none;">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXhOrizon in Kaohsiung</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="EXhOrizon in Kaohsiung 拍貼機">
  <meta property="og:description" content="來體驗專屬 EXhOrizon 拍貼機，留下你的韓系宇宙風拍貼吧！">
  <meta property="og:image" content="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <!-- 導入像素風字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    html, body, div, h1, p, video, canvas, img, button, label {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #090a0f !important;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%) !important;
      background-repeat: repeat, repeat, repeat, repeat, no-repeat;
      background-size: 300px 300px, 300px 300px, 300px 300px, 300px 300px, 100% 100%;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(23, 25, 38, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 720px;
      max-width: 95vw;
    }

    .music-toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 200;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
    }

    .music-toggle-btn:hover {
      background: rgba(30, 58, 138, 0.9);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
      transform: scale(1.05);
    }

    .music-toggle-btn.playing {
      border-color: #4ade80;
      color: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      margin-top: 10px;
    }

    h1.exo-title {
      width: 100%;
      text-align: center;
      font-family: 'Orbitron', Impact, sans-serif !important;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 
                  0 0 20px rgba(99, 102, 241, 0.9),
                  0 0 30px rgba(56, 189, 248, 0.5);
    }

    /* 🎯 像素風跑馬燈樣式 */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 6px 0;
      margin-bottom: 12px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: marqueeScroll 12s linear infinite;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      letter-spacing: 2px;
    }

    @keyframes marqueeScroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .controls-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .preview-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #webcam.front-camera {
      transform: scaleX(-1);
    }

    #webcam.rear-camera {
      transform: scaleX(1);
    }

    /* 🎯 相機畫面上即時顯示挖孔剪影框容器 */
    #camera-guides-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 45;
    }

    .camera-guide-box {
      position: absolute;
      border: 2px dashed rgba(56, 189, 248, 0.8);
      background: rgba(56, 189, 248, 0.12);
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    #flash-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.1s ease-out;
    }

    #flash-effect.flash-active {
      opacity: 0.95;
    }

    #countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(56, 189, 248, 0.8);
      z-index: 999;
    }

    .flip-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 80;
      transition: all 0.2s ease;
    }

    .flip-btn:hover {
      background: rgba(56, 189, 248, 0.8);
      transform: rotate(180deg);
    }

    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      position: relative;
      z-index: 100;
      flex: 1;
      padding: 12px 8px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
      background: #1e293b;
      border-color: #334155;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-color: rgba(56, 189, 248, 0.3);
      color: #93c5fd;
    }

    .btn.success {
      margin-top: 15px;
      width: 100%;
      font-size: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border-color: #7dd3fc;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    .btn.video-btn {
      margin-top: 8px;
      width: 100%;
      font-size: 13px;
      background: linear-gradient(135deg, #4c1d95 0%, #8b5cf6 100%);
      border-color: #c084fc;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    .picker-group {
      margin-top: 10px;
      width: 100%;
    }

    .picker-group label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      display: block;
    }

    .options-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }

    .frame-option {
      height: 48px;
      background: #0f172a;
      border: 2px solid #1e3a8a;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .frame-option.active {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    .frame-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #photo-strip {
      position: relative;
      width: 240px;
      height: 720px;
      background-color: transparent;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .photo-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .photo-frame {
      position: absolute;
      left: 18px;
      width: 204px;
      height: 141px;
      background-color: #000;
      overflow: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      z-index: 5;
      pointer-events: none;
    }

    #final-result-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 20;
      object-fit: fill;
      cursor: pointer;
      display: none;
    }

    #final-result-img.printing-animation {
      animation: photoPrintSlide 1.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes photoPrintSlide {
      0% {
        transform: translateY(-100%);
        opacity: 0.1;
        filter: brightness(2.5) contrast(0.5);
      }
      50% {
        opacity: 0.7;
        filter: brightness(1.3) contrast(0.9);
      }
      100% {
        transform: translateY(0);
        opacity: 1;
        filter: brightness(1) contrast(1);
      }
    }

    #youtube-player-container, #hidden-recorder-container {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 100%;
        padding: 12px;
      }
      .controls-panel {
        width: 100%;
      }
      .music-toggle-btn {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="music-btn" class="music-toggle-btn">
      <span id="music-icon">🎵</span> <span id="music-text">BGM</span>
    </button>
    
    <div id="youtube-player-container">
      <div id="yt-player"></div>
    </div>

    <div id="hidden-recorder-container">
      <canvas id="video-record-canvas" width="240" height="720"></canvas>
    </div>

    <h1 class="exo-title">EXhOrizon in Kaohsiung</h1>

    <!-- 🎯 像素風跑馬燈 -->
    <div class="marquee-container">
      <div class="marquee-text">★ WE ARE ONE ★ EXHORIZON IN KAOHSIUNG ★ KEEP SMILING ★ WE ARE ONE ★</div>
    </div>
    
    <div class="main-layout">
      <div class="controls-panel">
        <div class="camera-container">
          <video id="webcam" autoplay playsinline muted></video>
          <!-- 🎯 攝影機畫面上的即時挖孔引導框 -->
          <div id="camera-guides-layer"></div>
          <div id="flash-effect"></div>
          <div id="countdown-overlay"></div>
          <button id="flip-btn" class="flip-btn" title="切換前後鏡頭">🔄</button>
        </div>

        <div class="picker-group">
          <label>🖼️ 1. 請選擇專屬相框：</label>
          <div class="options-row">
            <div class="frame-option active" data-frame="frame_warm" data-slots="4">
              <img src="frame_warm.png" alt="warm">
            </div>
            <div class="frame-option" data-frame="frame_cool" data-slots="4">
              <img src="frame_cool.png" alt="cool">
            </div>
            <div class="frame-option" data-frame="frame_pink_3" data-slots="3">
              <img src="frame_pink_3.png" alt="pink">
            </div>
            <div class="frame-option" data-frame="frame_blue_3" data-slots="3">
              <img src="frame_blue_3.png" alt="blue">
            </div>
          </div>
        </div>

        <div class="buttons">
          <button id="start-btn" class="btn primary">2. 開始連拍 (4張)</button>
          <button id="retake-btn" class="btn secondary" disabled>重新拍照</button>
        </div>

        <button id="download-btn" class="btn success" disabled>下載照片作品 💾</button>
        <button id="download-video-btn" class="btn video-btn" disabled>下載動態相框影片 🎥</button>
      </div>

      <div class="preview-panel">
        <div id="photo-strip">
          <div class="photo-layer">
            <div class="photo-frame"><canvas id="canvas1"></canvas></div>
            <div class="photo-frame"><canvas id="canvas2"></canvas></div>
            <div class="photo-frame"><canvas id="canvas3"></canvas></div>
            <div class="photo-frame"><canvas id="canvas4"></canvas></div>
          </div>

          <img id="frame-overlay" src="frame_warm.png" alt="相框">
          <img id="final-result-img" alt="長按儲存拍貼">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXO-L 韓式四格拍貼機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>✨ EXO-L 韓式四格拍貼機 ✨</h1>
    
    <!-- 左側控制區 -->
    <div class="controls-panel">
      <div class="camera-container">
        <video id="webcam" class="filter-normal" autoplay playsinline muted></video>
        <div id="countdown-overlay"></div>
      </div>

      <div class="buttons">
        <button id="start-btn" class="btn primary">開始連拍 (4張)</button>
        <button id="retake-btn" class="btn secondary" disabled>重新拍照</button>
      </div>

      <!-- 特效濾鏡選擇區 -->
      <div class="picker-group">
        <label>✨ 選擇特效濾鏡：</label>
        <div class="options-row">
          <button class="filter-btn active" data-filter="normal">原圖</button>
          <button class="filter-btn" data-filter="beauty">柔焦美肌</button>
          <button class="filter-btn" data-filter="retro">韓式復古</button>
          <button class="filter-btn" data-filter="vintage">底片膠片</button>
          <button class="filter-btn" data-filter="bw">冷調黑白</button>
        </div>
      </div>

      <!-- 相框選擇區 -->
      <div class="picker-group">
        <label>🖼️ 選擇專屬相框：</label>
        <div class="options-row">
          <div class="frame-option active" data-frame="warm">
            <img src="frame_warm.png" alt="暖色手繪框">
          </div>
          <div class="frame-option" data-frame="cool">
            <img src="frame_cool.png" alt="銀河藍色框">
          </div>
        </div>
      </div>

      <button id="download-btn" class="btn success" disabled>下載拍貼作品 💾</button>
    </div>

    <!-- 右側預覽區 -->
    <div class="preview-panel">
      <div id="photo-strip">
        <div class="photo-layer">
          <div class="photo-frame"><canvas id="canvas1"></canvas></div>
          <div class="photo-frame"><canvas id="canvas2"></canvas></div>
          <div class="photo-frame"><canvas id="canvas3"></canvas></div>
          <div class="photo-frame"><canvas id="canvas4"></canvas></div>
        </div>

        <!-- PNG 相框覆蓋最上層 -->
        <img id="frame-overlay" src="frame_warm.png" alt="相框">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

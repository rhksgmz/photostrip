<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXhOrizon in Kaohsiung</title>
  
  <!-- 載入 EXO 專屬科技金屬感字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================================================
       1. 絕對防跑版重置
       ========================================================= */
    html, body, div, h1, p, video, canvas, img, button, label {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #090a0f !important;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%) !important;
      background-repeat: repeat, repeat, repeat, repeat, no-repeat;
      background-size: 300px 300px, 300px 300px, 300px 300px, 300px 300px, 100% 100%;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    /* 主卡片容器 */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(23, 25, 38, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 680px;
      max-width: 95vw;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    h1.exo-title {
      width: 100%;
      text-align: center;
      font-family: 'Orbitron', Impact, sans-serif !important;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 15px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 
                  0 0 20px rgba(99, 102, 241, 0.9),
                  0 0 30px rgba(56, 189, 248, 0.5);
    }

    .controls-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .preview-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 相機畫面 */
    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    /* 按鈕與選單 */
    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      position: relative;
      z-index: 100;
      flex: 1;
      padding: 12px 8px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
      background: #1e293b;
      border-color: #334155;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-color: rgba(56, 189, 248, 0.3);
      color: #93c5fd;
    }

    .btn.success {
      margin-top: 15px;
      width: 100%;
      font-size: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border-color: #7dd3fc;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    .picker-group {
      margin-top: 15px;
      width: 100%;
    }

    .picker-group label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
    }

    .options-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .frame-option {
      flex: 1;
      height: 50px;
      background: #0f172a;
      border: 2px solid #1e3a8a;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .frame-option.active {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    .frame-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 🎯 拍貼框座標 (往下 0.05cm + 間距縮小 0.02cm 微調) */
    #photo-strip {
      position: relative;
      width: 240px;
      height: 720px;
      background-color: transparent;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .photo-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .photo-frame {
      position: absolute;
      left: 18px;
      width: 204px;
      height: 141px;
      background-color: #000;
      overflow: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* 🎯 精密換算後的 Y 軸座標 */
    .photo-frame:nth-child(1) { top: 30.5px; }
    .photo-frame:nth-child(2) { top: 177.9px; }
    .photo-frame:nth-child(3) { top: 325.3px; }
    .photo-frame:nth-child(4) { top: 472.7px; }

    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
    }

    #final-result-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      object-fit: fill;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 100%;
        padding: 12px;
      }
      .controls-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="exo-title">EXhOrizon in Kaohsiung</h1>
    
    <div class="main-layout">
      <!-- 左側：控制面板區 -->
      <div class="controls-panel">
        <div class="camera-container">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="countdown-overlay"></div>
        </div>

        <div class="buttons">
          <button id="start-btn" class="btn primary">開始連拍 (4張)</button>
          <button id="retake-btn" class="btn secondary" disabled>重新拍照</button>
        </div>

        <div class="picker-group">
          <label>🖼️ 選擇專屬相框：</label>
          <div class="options-row">
            <div class="frame-option active" data-frame="warm">
              <img src="frame_warm.png" alt="暖色手繪框">
            </div>
            <div class="frame-option" data-frame="cool">
              <img src="frame_cool.png" alt="銀河藍色框">
            </div>
          </div>
        </div>

        <button id="download-btn" class="btn success" disabled>下載 / 長按儲存作品 💾</button>
      </div>

      <!-- 右側：拍貼預覽區 -->
      <div class="preview-panel">
        <div id="photo-strip">
          <div class="photo-layer">
            <div class="photo-frame"><canvas id="canvas1"></canvas></div>
            <div class="photo-frame"><canvas id="canvas2"></canvas></div>
            <div class="photo-frame"><canvas id="canvas3"></canvas></div>
            <div class="photo-frame"><canvas id="canvas4"></canvas></div>
          </div>

          <img id="frame-overlay" src="frame_warm.png" alt="相框">
          <img id="final-result-img" alt="長按儲存拍貼" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
